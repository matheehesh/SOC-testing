spring.application.name=api-gateway
server.port=9000
spring.cloud.gateway.routes[0].id=user-service
spring.cloud.gateway.routes[0].uri=${USER_SERVICE_URL:http://user-service:9001}
spring.cloud.gateway.routes[0].predicates[0]=Path=/auth/**
spring.cloud.gateway.routes[1].id=job-service
spring.cloud.gateway.routes[1].uri=${JOB_SERVICE_URL:http://job-service:9002}
spring.cloud.gateway.routes[1].predicates[0]=Path=/jobs/**
spring.cloud.gateway.routes[2].id=matching-service
spring.cloud.gateway.routes[2].uri=${MATCHING_SERVICE_URL:http://matching-service:9003}
spring.cloud.gateway.routes[2].predicates[0]=Path=/matches/**
spring.cloud.gateway.routes[3].id=broker-service
spring.cloud.gateway.routes[3].uri=${BROKER_SERVICE_URL:http://broker-service:9004}
spring.cloud.gateway.routes[3].predicates[0]=Path=/brokers/**
spring.cloud.gateway.routes[4].id=notification-service
spring.cloud.gateway.routes[4].uri=${NOTIFICATION_SERVICE_URL:http://notification-service:9005}
spring.cloud.gateway.routes[4].predicates[0]=Path=/notifications/**
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedOriginPatterns=*
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedMethods=GET,POST,PUT,DELETE,OPTIONS
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowedHeaders=*
